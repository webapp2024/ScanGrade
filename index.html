<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2733">
<title>ScanGrade สแกน</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1d2533; --ink2: #5a6474; --ink3: #8b93a1; --line: #e4e1da; --paper: #faf8f4; --card: #fff;
  --primary: #2c4a86; --primary-soft: #e6ecf7; --accent: #d2402f; --ok: #2e8a55; --ok-soft: #e4f4ea;
  --warn: #b27a12; --warn-soft: #fbf1dc; --danger: #c73a2b; --danger-soft: #fbe7e4; --dark: #151b24;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 16px/1.45 'Sarabun', system-ui, sans-serif; }
button { font: inherit; }
.hidden { display: none !important; }
.screen { min-height: 100%; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); max-width: 560px; margin: 0 auto; }
h1 { font-size: 1.45rem; margin: 0 0 .25rem; }
.sub { color: var(--ink2); margin: 0 0 1.25rem; font-size: .95rem; }
.brand { display: flex; align-items: center; gap: .7rem; margin: 1.2rem 0 1.5rem; }
.brand .mark { width: 46px; height: 46px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; }
.brand b { font-size: 1.35rem; display: block; line-height: 1.1; }
.brand small { color: var(--ink2); }
label { display: block; font-weight: 600; font-size: .9rem; color: var(--ink2); margin: .9rem 0 .3rem; }
input { width: 100%; font: inherit; padding: .7rem .85rem; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
input:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border: 0; border-radius: 12px; padding: .8rem 1.1rem; font-weight: 600; cursor: pointer; background: #ece9e2; color: var(--ink); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-block { width: 100%; margin-top: 1.1rem; }
.btn:disabled { opacity: .55; }
.btn-sm { padding: .45rem .8rem; font-size: .9rem; border-radius: 10px; }
.err { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: .6rem .8rem; margin-top: .9rem; font-size: .92rem; }
.topline { display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem; }
.topline .grow { flex: 1; min-width: 0; }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
.list { display: flex; flex-direction: column; gap: .6rem; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .85rem 1rem; display: flex; align-items: center; gap: .8rem; cursor: pointer; text-align: left; width: 100%; color: inherit; }
.item b { display: block; }
.item small { color: var(--ink2); }
.item .grow { flex: 1; min-width: 0; }
.pill { display: inline-block; border-radius: 99px; font-size: .78rem; padding: .05rem .55rem; font-weight: 600; white-space: nowrap; }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-bad { background: var(--danger-soft); color: var(--danger); }
.pill-mute { background: #efece6; color: var(--ink3); }
.empty { text-align: center; color: var(--ink3); padding: 2.5rem 1rem; }
.stats { display: flex; gap: .5rem; margin: 0 0 1rem; }
.stats div { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: .5rem .7rem; }
.stats b { font-size: 1.35rem; display: block; line-height: 1.1; }
.stats small { color: var(--ink2); font-size: .8rem; }

/* ---------- scan ---------- */
#scrScan { position: fixed; inset: 0; background: var(--dark); color: #fff; padding: 0; max-width: none; overflow: hidden; }
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.scan-top { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) 12px 12px; display: flex; gap: .6rem; align-items: center; background: linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,0)); }
.scan-top .grow { flex: 1; min-width: 0; }
.scan-top b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scan-top small { color: #c7cdd6; }
.darkbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
.darkbtn.on { background: #ffd23f; color: #000; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 118px); background: rgba(0,0,0,.6); padding: .45rem .9rem; border-radius: 99px; font-size: .92rem; white-space: nowrap; }
.hint.good { background: var(--ok); }
.scan-bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 18px calc(env(safe-area-inset-bottom) + 18px); display: flex; align-items: center; justify-content: space-between; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.7)); }
.shutter { width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.25); cursor: pointer; }
.shutter:active { background: #fff; }
.counter { min-width: 84px; font-size: .85rem; color: #d7dce3; }
.counter b { font-size: 1.3rem; color: #fff; display: block; line-height: 1.1; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
.flash.go { opacity: .7; transition: none; }

/* result sheet */
.result { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); color: var(--ink); border-radius: 18px 18px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 88%; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,.35); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.r-head { display: flex; gap: .8rem; align-items: flex-start; }
.r-head .grow { flex: 1; min-width: 0; }
.r-name { font-size: 1.2rem; font-weight: 700; line-height: 1.2; }
.r-meta { color: var(--ink2); font-size: .9rem; margin-top: .15rem; }
.r-score { text-align: right; flex: none; }
.r-score b { font-size: 2.3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.r-score small { color: var(--ink2); display: block; }
.r-flags { display: flex; flex-wrap: wrap; gap: .35rem; margin: .7rem 0 .2rem; }
.r-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; margin-top: .6rem; }
.r-grid span { text-align: center; font-size: .66rem; line-height: 1.1; border-radius: 6px; padding: 3px 0; background: #efece6; color: var(--ink3); }
.r-grid span b { display: block; font-size: .85rem; color: var(--ink); }
.r-grid .y { background: var(--ok-soft); } .r-grid .y b { color: var(--ok); }
.r-grid .n { background: var(--danger-soft); } .r-grid .n b { color: var(--danger); }
.r-grid .m { background: var(--warn-soft); outline: 2px solid var(--warn); } .r-grid .m b { color: var(--warn); }
.r-grid .c { text-decoration: line-through; }
.r-actions { display: flex; gap: .6rem; margin-top: 1rem; }
.r-actions .btn { flex: 1; }
.r-code { display: flex; gap: .5rem; align-items: center; margin-top: .6rem; }
.r-code input { max-width: 140px; font-size: 1.1rem; letter-spacing: .1em; text-align: center; padding: .45rem; }
.countdown { height: 4px; background: var(--primary-soft); border-radius: 4px; overflow: hidden; margin-top: .8rem; }
.countdown i { display: block; height: 100%; width: 100%; background: var(--primary); transform-origin: left; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 70px); transform: translateX(-50%); background: rgba(20,24,32,.92); color: #fff; padding: .55rem 1rem; border-radius: 12px; z-index: 50; font-size: .92rem; max-width: 92%; text-align: center; }
.toast.bad { background: var(--danger); }
</style>
</head>
<body>

<!-- ตั้งค่าครั้งแรก -->
<section class="screen hidden" id="scrSetup">
  <div class="brand"><div class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1" fill="#fff"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5" fill="#fff"/></svg></div><div><b>ScanGrade</b><small>สแกนกระดาษคำตอบ</small></div></div>
  <h1>เชื่อมต่อระบบ</h1>
  <p class="sub">สแกน QR ที่หน้า <b>ตั้งค่า › ระบบ</b> ของระบบหลังบ้าน หรือวางลิงก์เว็บแอป (…/exec)</p>
  <label for="apiUrl">ลิงก์เว็บแอป</label>
  <input id="apiUrl" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <div class="err hidden" id="setupErr"></div>
  <button class="btn btn-primary btn-block" id="setupBtn">เชื่อมต่อ</button>
</section>

<!-- เข้าสู่ระบบ -->
<section class="screen hidden" id="scrLogin">
  <div class="brand"><div class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1" fill="#fff"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5" fill="#fff"/></svg></div><div><b>ScanGrade</b><small id="loginSchool">สแกนกระดาษคำตอบ</small></div></div>
  <h1>เข้าสู่ระบบ</h1>
  <p class="sub">ใช้บัญชีเดียวกับระบบหลังบ้าน</p>
  <form id="loginForm">
    <label for="lUser">ชื่อผู้ใช้</label><input id="lUser" autocomplete="username" autocapitalize="none" required>
    <label for="lPass">รหัสผ่าน</label><input id="lPass" type="password" autocomplete="current-password" required>
    <div class="err hidden" id="loginErr"></div>
    <button class="btn btn-primary btn-block" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
  </form>
  <button class="btn btn-sm btn-block" id="resetApi" style="background:transparent;color:var(--ink3)">เปลี่ยนลิงก์เว็บแอป</button>
</section>

<!-- เลือกชุดข้อสอบ -->
<section class="screen hidden" id="scrExams">
  <div class="topline"><div class="grow"><h1>เลือกชุดข้อสอบ</h1><div class="sub" style="margin:0" id="exUser"></div></div>
    <button class="iconbtn" id="exQueue" aria-label="รายการที่สแกน"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    <button class="iconbtn" id="exRefresh" aria-label="โหลดใหม่"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button></div>
  <div class="stats" id="exStats"></div>
  <div class="list" id="exList"></div>
  <button class="btn btn-sm btn-block" id="logoutBtn" style="background:transparent;color:var(--ink3)">ออกจากระบบ</button>
</section>

<!-- สแกน -->
<section class="screen hidden" id="scrScan">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="flash" id="flash"></div>
  <div class="scan-top">
    <button class="darkbtn" id="scBack" aria-label="กลับ"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="grow"><b id="scTitle">—</b><small id="scSub"></small></div>
    <button class="darkbtn hidden" id="scTorch" aria-label="ไฟฉาย"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
  </div>
  <div class="hint" id="scHint">วางกระดาษให้เห็นสี่เหลี่ยมดำครบ 4 มุม</div>
  <div class="scan-bottom">
    <div class="counter"><b id="scCount">0</b>แผ่นในรอบนี้</div>
    <button class="shutter" id="scShutter" aria-label="ถ่ายเอง"></button>
    <div class="counter" style="text-align:right"><b id="scPending">0</b>รอส่ง</div>
  </div>
  <div class="result hidden" id="result"></div>
</section>

<!-- รายการที่สแกน -->
<section class="screen hidden" id="scrQueue">
  <div class="topline"><button class="iconbtn" id="qBack" aria-label="กลับ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="grow"><h1 style="margin:0">รายการที่สแกน</h1></div>
    <button class="btn btn-sm btn-primary" id="qSync">ส่งตอนนี้</button></div>
  <div class="stats" id="qStats"></div>
  <div class="list" id="qList"></div>
  <button class="btn btn-sm btn-block" id="qClear" style="background:transparent;color:var(--ink3)">ล้างรายการที่ส่งสำเร็จแล้ว</button>
</section>

<canvas id="work" class="hidden"></canvas>
<canvas id="small" class="hidden"></canvas>
<script src="sheet-layout.js"></script>
<script src="omr.js"></script>
<script src="app.js"></script>
</body>
</html>
